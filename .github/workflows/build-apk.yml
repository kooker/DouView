name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Setup google-services.json
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"doumou-live-workbench","storage_bucket":"doumou-live-workbench.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:9876543210abcdef","android_client_info":{"package_name":"com.aistudio.doumoulive.kjzpxq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForGoogleServicesPluginDoumouLive"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
            echo "Generated fallback app/google-services.json"
          fi

      - name: Setup Keystores and Certificates
        run: |
          # 1. 优先从 base64 还原已有的 debug.keystore
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
            echo "Decoded debug.keystore from base64."
          fi
          # 2. 如果仍不存在或大小为0，使用 keytool 自动生成标准 debug.keystore，确保 validateSigningDebug 永不失败
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. 优先从 base64 还原已有的 my-upload-key.jks
          if [ -f "my-upload-key.jks.base64" ] && [ -s "my-upload-key.jks.base64" ]; then
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks 2>/dev/null || base64 --decode my-upload-key.jks.base64 > my-upload-key.jks 2>/dev/null || true
            echo "Decoded my-upload-key.jks from base64."
          fi
          # 4. 如果仍不存在或大小为0，使用 keytool 自动生成正式生产密钥 my-upload-key.jks
          if [ ! -f "my-upload-key.jks" ] || [ ! -s "my-upload-key.jks" ]; then
            echo "Generating fallback production upload keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keypass android -storepass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DoumouLive, OU=Production, O=DoumouLive, L=Beijing, ST=Beijing, C=CN"
          fi

          ls -lh debug.keystore my-upload-key.jks

      - name: Build Release and Debug APKs
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
          KEY_ALIAS: "upload"
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon -Dksp.incremental=false --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouView-Release-v1.0.0-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouView-Debug-v1.0.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
